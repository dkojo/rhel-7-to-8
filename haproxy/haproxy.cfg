# The load balancer users talk to. The runtime API on :9999 lets Ansible drain a server before it's replaced.
global
    stats socket ipv4@0.0.0.0:9999 level admin

defaults
    mode http
    timeout connect 2s
    timeout client 10s
    timeout server 10s

# Docker's DNS: when a RHEL 8 host takes over a name like "web1", HAProxy picks up its new address
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

frontend portal
    bind :80
    default_backend web

backend web
    balance roundrobin
    option httpchk GET /health
    http-response set-header X-Served-By %s
    server web1 web1:80 check inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
    server web2 web2:80 check inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
    server web3 web3:80 check inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
