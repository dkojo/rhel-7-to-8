# Ansible reaches each host through Docker (community.docker.docker), the way it would use SSH on real servers.
[rhel7]
web1-el7
web2-el7
web3-el7

[rhel8]
web1-el8
web2-el8
web3-el8

[rhel7:vars]
ansible_python_interpreter=/usr/bin/python2

[rhel8:vars]
ansible_python_interpreter=/usr/libexec/platform-python

[all:vars]
ansible_connection=community.docker.docker
